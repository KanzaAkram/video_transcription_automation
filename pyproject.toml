[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-pipeline"
version = "0.1.0"
description = "Zoom recordings to syllabus-organised, transcribed lectures on Google Drive"
readme = "README.md"
# The core package, the API, the tests and the dry run all run on any 3.11+.
# The ASR *worker* additionally needs 3.11-3.13 because ctranslate2 / torch
# wheels lag new CPython releases — enforced by the marker on the `asr` extra
# below rather than here, so a 3.14 interpreter can still install and run
# everything else.
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "tenacity>=8.3",           # retry/backoff for all external calls
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# The webhook receiver / admin API. Light enough to run anywhere.
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

# Google Drive + Zoom clients.
cloud = [
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
]

# Transcription. Needs ffmpeg on PATH; CUDA strongly recommended.
# The markers keep these off interpreters with no wheels yet — installing the
# extra on 3.14 is a no-op rather than a build failure, and `verify_config.py`
# reports the version mismatch explicitly.
asr = [
    "faster-whisper>=1.0.3; python_version < '3.14'",
    "ctranslate2>=4.3; python_version < '3.14'",
]

# Classification. Lightweight on purpose: BM25 retrieval plus the Claude call.
classify = [
    "anthropic>=0.40",
    "rank-bm25>=0.2.2",
]

# Semantic retrieval. Split out because it pulls torch, which is a multi-GB
# download and has no wheels on the newest CPython. Retrieval degrades to
# lexical-only without it (see pipeline/classify/retriever.py), so nothing
# breaks — it just gets worse at paraphrase. Install it on the worker host.
embeddings = [
    "sentence-transformers>=3.0",
]

# Persistence and the work queue.
queue = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.1",
    "celery[redis]>=5.4",
]

# Enough to run the tests and the dry run. Deliberately excludes `embeddings`
# and `asr` so a fresh clone installs in seconds rather than pulling torch.
dev = [
    "lecture-pipeline[api,cloud,classify,queue]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Everything, including the heavy ML dependencies. Use on the worker host.
all = ["lecture-pipeline[api,cloud,asr,classify,embeddings,queue,dev]"]

[project.scripts]
lecture-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["pipeline"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
