[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-pipeline"
version = "0.1.0"
description = "Zoom recordings to syllabus-organised, transcribed lectures on Google Drive"
readme = "README.md"
# Upper bound is deliberate: ctranslate2 / torch wheels (needed by the ASR
# worker) lag new CPython releases. The API service alone runs fine on 3.14.
requires-python = ">=3.11,<3.14"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "tenacity>=8.3",           # retry/backoff for all external calls
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# The webhook receiver / admin API. Light enough to run anywhere.
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

# Google Drive + Zoom clients.
cloud = [
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
]

# Transcription. Needs ffmpeg on PATH; CUDA strongly recommended.
asr = [
    "faster-whisper>=1.0.3",
    "ctranslate2>=4.3",
]

# Classification: embeddings for candidate retrieval + Claude for the decision.
classify = [
    "anthropic>=0.40",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
]

# Persistence and the work queue.
queue = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.1",
    "celery[redis]>=5.4",
]

dev = [
    "lecture-pipeline[api,cloud,classify,queue]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Everything, including the GPU-dependent ASR extra.
all = ["lecture-pipeline[api,cloud,asr,classify,queue,dev]"]

[project.scripts]
lecture-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["pipeline"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
