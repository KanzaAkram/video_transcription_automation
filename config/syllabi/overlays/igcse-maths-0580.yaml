# Curation overlay for Cambridge IGCSE Mathematics 0580 (2025-2027).
#
# Everything the official syllabus already contains - topic numbers, subtopic
# codes, subtopic titles, learning-objective text - is extracted by the
# ingester and must NOT be repeated here. This file holds only what the
# syllabus cannot tell you:
#
#   chapters              which syllabus subtopics are taught as one unit, and
#                         which Drive folder that unit's recordings live in
#   short_title           the KEYWORDS that go in the filename
#   keywords / aliases    what a teacher actually says out loud, which is what
#                         retrieval scores the transcript against
#   teaching_order        the order the chapters are actually taught in
#
# -- A chapter is a Drive folder, not a syllabus topic -------------------------
# depth 0 is the chapter: one Drive folder, and the unit a recording is filed
# into whole. A recording is never split across two chapters; when a transcript
# touches several, the heaviest one wins.
#
# depth 1 is the subtopic: one Cambridge subtopic code, and the unit filenames
# are built from. One subtopic gives one name; two subtopics give two names;
# three is not a thing - the cap is hard.
#
# Chapters and syllabus topics do not have to line up. In AS Chemistry they
# famously do not: 9701 topic 1 "Atomic structure" is split across two of the
# user's Drive folders. Here they happen to, one chapter per syllabus topic,
# because there is no Drive listing yet to say otherwise - see below. Nothing
# in the format requires it, and splitting topic 2 into an "Algebra" folder and
# a "Graphs and Calculus" folder later is an overlay edit, not a schema change.
#
# -- Drive folders --------------------------------------------------------------
# Every chapter carries a numbered drive_folder_name, matching the convention
# the user's AS Chemistry tree already uses: "0. Introduction", "1. Number",
# "2. Algebra and Graphs". The leading ordinal is teaching_order, so the folder
# listing sorts into the order the course is actually taught rather than
# alphabetically - which is the whole reason the numbers are there.
#
# coursebook_chapter stays null: unlike Chemistry, there is no coursebook whose
# chapter numbering disagrees with the teaching order, so there is no second
# number to record. If one appears, it goes here and the folder name grows a
# "(Chapter N)" suffix exactly as Chemistry's do - never derived from
# teaching_order, which is the mistake ADR-013 exists to prevent.
#
# teaching_order currently follows the syllabus topic order 1-9. If the course
# is taught in a different order, fix it HERE and re-run the ingester. That is
# an overlay edit plus a regeneration; it is never a code change, because no
# part of the pipeline hard-codes a folder name, and any patch that adds one is
# the bug rather than the fix.
#
# -- What this particular syllabus does to your keywords -----------------------
# The 0580 source is shaped differently from the Chemistry one and it bites in
# two places. Both are handled here, in the keywords; the objectives themselves
# are copied verbatim by the ingester and are not edited.
#
# 1. Half the learning objectives are not objectives. Entries whose text opens
#    "Notes and examples:" carry the worked detail, and that is where the
#    concrete spoken vocabulary lives - "recurring decimal", "rationalise the
#    denominator", "three-figure bearing", "frequency density", "alternate
#    segment theorem". The formal objective above it reads "Understand and use
#    set language", which no teacher has ever said aloud. So the keywords below
#    are mined from the notes at least as hard as from the objectives.
#
# 2. Core and Extended statements of the same subtopic sit side by side as
#    separate objectives. 1.2 Sets carries both the two-set Core version and the
#    three-set Extended version; 1.4, 1.7, 1.10, 2.2, 2.5, 2.6, 2.7, 2.10, 2.11,
#    4.1, 4.5, 4.6, 4.7, 5.3, 5.5, 7.1, 8.1, 8.3, 9.2 and 9.3 do the same. They
#    are ONE subtopic and get ONE short_title, deliberately: a Core lesson and an
#    Extended lesson on the same material must not compete for two different
#    filenames. The keyword lists therefore span both tiers - "two sets" and
#    "three sets" both appear under 1.2 - so either lecture lands on the same
#    node and gets the same name.
#
# -- short_title is the filename -----------------------------------------------
# Keywords only, 2-4 words, under about 35 characters, Title Case, "&" over
# "and". It has to read like the user's own files - "Sep, 4 - Sigma and Pie
# Bonds.mp4" - and never like a syllabus sentence.
#
# Most 0580 subtopic titles are already good and are kept verbatim: "Surds",
# "Percentages", "Histograms", "Circle theorems I". The ones that were a list or
# a description are cut down - "Fractions, decimals and percentages" becomes
# "Fractions & Decimals", "Limits of accuracy" becomes "Upper & Lower Bounds",
# "Non-right-angled triangles" becomes "Sine & Cosine Rules", and "Pythagoras'
# theorem and trigonometry in 3D" becomes "Pythagoras & Trig in 3D".
#
# The Roman-numeral pairs stay numbered. "Indices I" / "Indices II" and "Circle
# theorems I" / "Circle theorems II" are genuinely different lessons taught weeks
# apart, and a filename that cannot tell them apart is worse than no filename.
#
# -- On keywords ---------------------------------------------------------------
# A keyword has to be a phrase a teacher says out loud, and every token in it has
# to land in the same ~4-minute window for it to count. So "solve the quadratic
# equation by factorisation" never fires, while "factorise" and "quadratic
# formula" both reliably do.
#
# It also has to SEPARATE a subtopic from its siblings, and maths is unusually
# bad for this: "equation", "number", "graph", "value", "answer" and "formula"
# are said in every lecture in the subject, so as keywords they fire everywhere
# and discriminate nothing. They are deliberately absent below. What is present
# is named methods and named objects - Venn diagram, HCF, standard form, upper
# bound, completing the square, nth term, perpendicular bisector, three-figure
# bearing, cosine rule, frustum, tree diagram, interquartile range, frequency
# density.
#
# That rule applies to ALIASES too, which is easy to forget because they read
# like labels rather than search terms. retriever._keyword_hits iterates
# (*keywords, *aliases) and cannot tell them apart, so a bare word parked in
# `aliases` fires exactly as widely as one in `keywords`. An earlier version of
# this file said the paragraph above and then carried "sets", "ratio", "rates",
# "time", "term", "equations", "angles", "gradient", "functions" and
# "Pythagoras" as single-token aliases or keywords - each of them the name of
# its own subtopic, and each of them said out loud by three or four siblings.
# They are gone. A subtopic's own name does not need to be a keyword: the
# `title` and `short_title` are both in search_document already, so the word
# still scores; listing it again only lets it score on the neighbours.
#
# A term goes in `keywords` OR in `aliases`, never in both. _keyword_hits
# counts it twice toward the coverage gate when it is in both, and
# search_document emits keywords twice plus aliases once - so a term listed
# twice carries three times the BM25 weight of an ordinary keyword, which is
# an invisible thumb on the scale rather than a decision anyone made.
#
# Where two subtopics genuinely share a term, the term goes to the one that owns
# it and the other is separated on something else. "Completing the square" sits
# on 2.2, where it is a named objective, and 2.5 is separated on "quadratic
# formula" and "solve by factorisation". "Exchange rate" sits on 1.16 Money, and
# 1.12 Rates keeps speed, density and flow. "Tree diagram" sits on 8.3, and 8.4
# is separated on "conditional probability" and "given that the first" - never
# on bare "given that", which tokenises to {given, that} and so fires on any
# window at all that happens to contain the word "given".

subject_id: igcse_maths
subject_name: IGCSE Mathematics
syllabus_code: "0580"
syllabus_years: "2025-2027"
node_id_prefix: math
source: >-
  Topic numbers, subtopic codes, subtopic titles and learning-objective text
  taken verbatim from the official Cambridge IGCSE Mathematics 0580 syllabus for
  2025, 2026 and 2027, including the interleaved Core and Extended statements
  and the "Notes and examples" entries. Chapter grouping, teaching order, short
  titles, keywords, aliases and subject vocabulary are hand-curated. No Drive
  folder names are known for this subject yet, so every chapter is pending.

# Primed into the ASR decoder for every lecture in this subject. Maths is full of
# words generic speech recognition has never met: "surd" comes back as "surd"
# only if the decoder was told to expect it, "frustum" becomes "frustrum",
# "isosceles" becomes almost anything. These are also the words classification
# leans on hardest, so the error is expensive twice over.
# Kept to ~50 deliberately: Taxonomy.vocabulary() weights these ten times a node
# keyword and then truncates the list, so a longer subject list would push every
# per-lecture term out of the ASR prompt.
subject_vocabulary:
  - surd
  - rationalise
  - reciprocal
  - quadratic
  - cubic
  - coefficient
  - indices
  - HCF
  - LCM
  - highest common factor
  - lowest common multiple
  - recurring decimal
  - upper bound
  - lower bound
  - simultaneous equations
  - factorise
  - completing the square
  - nth term
  - stationary point
  - asymptote
  - exponential
  - depreciation
  - perpendicular bisector
  - collinear
  - Cartesian
  - hypotenuse
  - Pythagoras
  - isosceles
  - scalene
  - congruent
  - rhombus
  - trapezium
  - parallelogram
  - decagon
  - tessellation
  - locus
  - radii
  - frustum
  - hemisphere
  - sine rule
  - cosine rule
  - SOHCAHTOA
  - theta
  - sigma
  - modulus
  - Venn diagram
  - quartile
  - interquartile range
  - cumulative frequency
  - frequency density

chapters:

  # -- 0. Introduction --------------------------------------------------------
  # Admin, not teaching. Excluded so a course-intro recording cannot absorb
  # genuine content - an intro session name-checks half the syllabus in forty
  # minutes and would otherwise outscore the lecture that actually taught it.
  #
  # It is still a real chapter with a real folder, because these sessions
  # exist and have to go somewhere: the 5 August recording is fifty-six
  # minutes of year plan, paper codes and calculator policy. Without this node
  # the classifier knows exactly what that recording is and has nowhere to put
  # it, so it lands in the folder root called "Unclassified".
  #
  # The title has to stay "Introduction": `naming.orientation_label` is the
  # same string, and it is what finds this node.
  - id: introduction
    title: Introduction
    teaching_order: 0
    coursebook_chapter: null
    drive_folder_name: "0. Introduction"
    exclude_from_classification: true
    aliases: [orientation, course intro, first class, welcome, induction]
    keywords:
      - syllabus
      - year plan
      - exam structure
      - paper 1
      - paper 2
      - paper 3
      - paper 4
      - core and extended
      - calculator policy
      - grade boundaries
      - course outline

  # -- 1 Number ---------------------------------------------------------------
  - id: number
    title: Number
    teaching_order: 1
    coursebook_chapter: null
    drive_folder_name: "1. Number"
    # "number" and "numbers" removed as aliases: they are this chapter's own
    # title, which search_document already indexes, and as keywords they fired
    # in 40 of 117 real windows including every chemistry lecture. "ratio" went
    # for the same reason - 10 fires, all of them on the chemistry deflection
    # lecture saying "charge to mass ratio". 1.11 carries the ratio vocabulary
    # that actually discriminates.
    aliases: [topic 1, chapter 1, arithmetic]
    keywords:
      - prime factors
      - HCF
      - LCM
      - standard form
      - percentage increase
      - ratio of two quantities
      - surd
      - significant figures
      - upper bound
    subtopics:

      - code: "1.1"
        short_title: Types of Number
        aliases: [prime factors, HCF and LCM, factors and multiples]
        keywords:
          - natural numbers
          - prime number
          - square number
          - cube number
          - common factor
          - common multiple
          - rational
          - irrational
          - reciprocal
          - highest common factor
          - lowest common multiple
          - HCF
          - LCM
          - product of prime factors
          - factor tree

      - code: "1.2"
        short_title: Sets & Venn Diagrams
        # Bare "sets" is not here: it fires on any window that says the word,
        # including 8.3's Venn-diagram probability work.
        aliases: [Venn diagrams, set language, sets and Venn diagrams, shading sets]
        # Core stops at two sets, Extended goes to three. Both tiers are keyworded
        # here so a Core lesson and an Extended lesson land on the same node.
        keywords:
          - Venn diagram
          - universal set
          - complement
          - union
          - intersection
          - subset
          - empty set
          - element of
          - set notation
          - number of elements
          - two sets
          - three sets
          - shade the region
          - curly brackets

      - code: "1.3"
        short_title: Powers & Roots
        aliases: [powers and roots, square roots, cube roots]
        keywords:
          - square root
          - cube root
          - fourth root
          - squared
          - cubed
          - recall of squares
          - corresponding roots
          - root sign
          - work out the root
          - perfect square

      - code: "1.4"
        short_title: Fractions & Decimals
        aliases: [fractions decimals and percentages, converting fractions,
                  recurring decimals]
        keywords:
          - proper fraction
          - improper fraction
          - mixed number
          - lowest terms
          - equivalent fractions
          - recurring decimal
          - terminating decimal
          - dot notation
          - numerator and denominator
          - convert to a decimal
          - fraction to a percentage
          - decimal to a fraction
          - cancel down

      - code: "1.5"
        short_title: Ordering & Inequality Signs
        aliases: [ordering quantities, inequality symbols, putting in order,
                  greater than and less than]
        keywords:
          # Bare "less than" removed as stopword-only; "less than or equal"
          # and the ordering phrases below carry the same subtopic.
          - order by magnitude
          - greater than or equal
          - less than or equal
          - not equal to
          - ascending order
          - descending order
          - smallest to largest
          - largest to smallest
          - order of size

      - code: "1.6"
        short_title: Four Operations
        aliases: [the four operations]
        keywords:
          - order of operations
          - BIDMAS
          - BODMAS
          - use of brackets
          - negative times a negative
          - adding fractions
          - multiplying fractions
          - dividing fractions
          - common denominator
          - temperature change
          - long multiplication
          - long division

      - code: "1.7"
        short_title: Indices I
        # 1.7 is the numerical half of indices - "find the value of 7 to the
        # power minus 2". The algebraic half is 2.4 Indices II, which is
        # separated on "simplify" and on letters. Both tiers of 1.7 sit here:
        # Core stops at integer indices, Extended adds fractional ones.
        aliases: [indices, indices one, numerical indices]
        # "power of a power" is gone: it is a description of the rule, not a
        # phrase anyone says. Across 117 real windows it fires zero times, and
        # its tokens are "power", "of", "a" - so all it ever did was carry two
        # function words into this node's BM25 document.
        #
        # Bare "base" is kept, against the audit's advice. It was proposed for
        # removal on the theory that it bleeds onto 2.4 and 1.17, and the word
        # certainly is ordinary English - but on the real recordings it fires
        # 13 times, all of them on the two indices lectures and none anywhere
        # else, and on two windows of 10 Aug it is the ONLY term that lets this
        # node through the gate. Removing it loses those windows for a risk
        # that does not materialise here. The phrases below are added so the
        # node no longer depends on it alone.
        keywords:
          - rules of indices
          - index laws
          - properties of indices
          - zero index
          - fractional index
          - fractional powers
          - anything to the power zero
          - negative power
          - add the powers
          - subtract the powers
          - multiply the powers
          - powers are added
          - powers are subtracted
          - same base
          - base is the same
          - goes to the denominator
          - base

      - code: "1.8"
        short_title: Standard Form
        aliases: [standard index form]
        keywords:
          - standard form
          - scientific notation
          - times ten to the power
          - ordinary number
          - very large numbers
          - very small numbers
          - decimal point moves
          # "between one and ten" is four stopwords. The spoken rule names the
          # digit position instead.
          - one non-zero digit before the decimal point
          - positive power of ten
          - negative power of ten
          - out of standard form
          - calculate in standard form

      - code: "1.9"
        short_title: Estimation & Rounding
        aliases: [estimation, rounding]
        keywords:
          - significant figures
          - decimal places
          - round to the nearest
          - nearest thousand
          - nearest whole number
          - one significant figure
          - estimate the value
          - degree of accuracy
          - reasonable degree of accuracy
          - rounding up
          - rounding down
          - approximate

      - code: "1.10"
        short_title: Upper & Lower Bounds
        aliases: [bounds, upper and lower bounds, error interval]
        keywords:
          - upper bound
          - lower bound
          - limits of accuracy
          - measured correct to
          - nearest centimetre
          - nearest metre
          - half a unit
          - maximum value
          - minimum value
          - bounds of the perimeter
          - bounds of the area
          - largest possible
          - smallest possible

      - code: "1.11"
        short_title: Ratio & Proportion
        # Numeric sharing only. Algebraic direct and inverse proportion is 2.8,
        # so "directly proportional" and the constant k are kept off this node.
        aliases: [ratio and proportion, sharing in a ratio, simplifying ratios,
                  dividing in a ratio]
        keywords:
          - simplify the ratio
          - divide in a given ratio
          - share in the ratio
          # "number of parts" alone is ordinary English; the ratio sense needs
          # "total".
          - total number of parts
          - one part is worth
          - proportional reasoning
          - unitary method
          - map scale
          - best value
          - adapt a recipe
          - equivalent ratio
          - ratio in its simplest form

      - code: "1.12"
        short_title: Rates & Average Speed
        # "compound measures" is the classroom name for the speed/density/
        # pressure family; bare "rates" fired on any window using the word.
        aliases: [compound measures, density and pressure, rate per unit time]
        keywords:
          - average speed
          - speed distance time
          - distance divided by time
          - metres per second
          - kilometres per hour
          - density
          - population density
          - pressure
          - flow rate
          - fuel consumption
          - hourly rate of pay
          - grams per cubic centimetre

      - code: "1.13"
        short_title: Percentages
        aliases: [percentage change, percentage calculations, reverse percentages]
        keywords:
          - percentage of a quantity
          - percentage increase
          - percentage decrease
          - simple interest
          - compound interest
          - reverse percentage
          - multiplier
          - percentage profit
          - profit and loss
          - discount
          - deposit
          - cost price
          - selling price
          - repeated percentage change

      - code: "1.14"
        short_title: Using a Calculator
        aliases: [using a calculator, calculator skills]
        keywords:
          - calculator display
          - do not round early
          - round the final answer
          - brackets on the calculator
          - fraction key
          - degrees minutes seconds
          - enter the value
          - interpret the display
          - memory button
          - calculator efficiently
