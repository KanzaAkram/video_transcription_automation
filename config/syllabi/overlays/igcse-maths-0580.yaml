      - code: "1.15"
        short_title: Time & Timetables
        # Bare "time" is said in every lecture in the subject ("at the same
        # time"), and 1.10, 1.12 and 1.14 all carry it in their own syllabus
        # text. "hours and minutes" went the same way: 1.14's notes are
        # literally "enter 2 hours 30 minutes as 2.5 hours". What is left is
        # clock-and-timetable vocabulary nothing else in Number uses.
        aliases: [timetables, clock times, journey duration]
        keywords:
          - 24-hour clock
          - 12-hour clock
          - timetable
          - read the timetable
          - train timetable
          - time zone
          - local time
          - time difference
          - departure time
          - arrival time
          - am and pm
          - days weeks months
          - duration of the journey

      - code: "1.16"
        short_title: Money & Currency
        aliases: [money problems, currency conversion, exchange rates]
        keywords:
          - exchange rate
          - convert currency
          - one currency to another
          - dollars
          - pounds
          - euros
          - rupees
          - cents
          - wages
          - bill
          - work out the change
          - cost in dollars

      - code: "1.17"
        short_title: Exponential Growth & Decay
        aliases: [exponential growth and decay, population growth]
        keywords:
          - exponential growth
          - exponential decay
          - depreciation
          - population change
          - growth factor
          - decay factor
          - initial amount
          - number of years
          - value after n years
          - halves each year
          - doubles each year
          - raised to the power n

      - code: "1.18"
        short_title: Surds
        # Whisper does not transcribe "surd". On 10 Aug - 33 minutes of surds -
        # it writes "search" ("the third form of exact answer could be search",
        # "you are representing in terms of search"), elsewhere "surge" and
        # "sird". Those are NOT added as aliases: they are ordinary English
        # words that would fire on every lecture in the syllabus. The node
        # needs vocabulary that survives the mis-transcription instead, which
        # is what the four terms below are - they are how this teacher frames
        # the topic ("exact answers ... fractions can be exact answers ... the
        # other form of exact answers are in terms of pi"), and they are said
        # in the clear.
        #
        # "in terms of pi" is also on 5.3, which is a different chapter rather
        # than a sibling. Both nodes genuinely say it; the BM25 score decides
        # which, and on a surds lecture this node now wins those windows.
        aliases: [surds, rationalising the denominator, exact form]
        keywords:
