# Curation overlay for Cambridge International A Level Biology 9700 (2025-2027).
#
# Everything the syllabus PDF already contains — topic numbers, subtopic
# numbers, titles, learning-outcome text — is extracted by
# scripts/ingest_syllabus.py and must NOT be repeated here. This file holds
# only what the PDF cannot tell you:
#
#   keywords / aliases    what a teacher actually says out loud, which is what
#                         retrieval scores the transcript against
#   drive_folder_name     where the recordings live
#   lessons               the teaching layer beneath each subtopic
#
# ── Why the lesson layer exists ───────────────────────────────────────────────
# Topic 12 has exactly two syllabus subtopics, "12.1 Energy" and
# "12.2 Respiration", but six recordings. Naming files after subtopics would
# produce two distinct names for six lectures, which is useless in a folder
# listing. The lesson layer is the level teaching actually happens at, and it
# is what goes in the filename.
#
# Lessons are NOT syllabus content, so they are emitted with verified: false.
# Each one cites the learning outcomes it covers by number; the ingester copies
# that outcome text onto the lesson node, so a lesson is retrieved against real
# syllabus prose rather than against a title someone made up.

subject_id: a2_biology
subject_name: A2 Biology
syllabus_code: "9700"
syllabus_years: "2025-2027"
node_id_prefix: bio
source: >-
  Topic, subtopic and learning-outcome text extracted verbatim from the official
  Cambridge International AS & A Level Biology 9700 syllabus for 2025, 2026 and
  2027. Keywords, aliases and the lesson layer are hand-curated.

# Primed into the ASR decoder for every lecture in this subject. These are the
# terms generic speech recognition reliably mangles — "Krebs" becomes "crabs",
# "chemiosmosis" becomes "chemo osmosis" — and they are also the terms
# classification leans on hardest, so the error is expensive twice over.
