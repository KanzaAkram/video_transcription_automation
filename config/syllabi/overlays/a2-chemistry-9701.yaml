# Curation overlay for the A Level half of Cambridge AS & A Level Chemistry 9701
# (2025-2027).
#
# The syllabus half of this taxonomy - topic and subtopic numbers, titles and
# all 146 learning outcomes - is extracted verbatim from the official PDF by
# scripts/ingest_syllabus.py and marked verified: true. Nothing in this file
# repeats it. What lives here is only what the PDF cannot say:
#
#   drive_folder_name   which folder a chapter's recordings live in
#   teaching_order      the order the chapters are actually taught in
#   short_title         the KEYWORDS that go in the filename
#   keywords / aliases  what a teacher says out loud
#
# -- Scope --------------------------------------------------------------------
# 9701 is one syllabus covering two years, and the PDF interleaves them: topics
# 1-22 are "AS Level subject content", 23-37 are "A Level subject content".
# This overlay covers the A Level half only, which is what the "A2 chemistry"
# recordings are. The AS half has its own taxonomy, built from a JSON source
# rather than this PDF, and the two must not be merged: a lecture on A Level
# Electrochemistry (24) and one on AS Electrochemistry (6) are different
# lessons that share a title, and one taxonomy holding both would let a
# recording be named after the wrong year of the course.
#
# -- Chapter folders ----------------------------------------------------------
# One chapter per syllabus topic, numbered in syllabus order, matching the
# convention the AS Chemistry Drive tree already uses ("1. Atomic Structure
# (Chapter 1)"). teaching_order carries the leading ordinal so the folder
# listing sorts into teaching order rather than alphabetically.
#
# coursebook_chapter is null throughout: there is no coursebook numbering on
# record for this half yet. When there is, it goes HERE and the folder name
# grows a "(Chapter N)" suffix - never derived from teaching_order, which is
# the transposition ADR-013 exists to prevent.
#
# -- short_title --------------------------------------------------------------
# Keywords only, 2-4 words, Title Case, under about 35 characters. Cambridge
# writes subtopic titles as whole sentences - 27.1 is "Similarities and trends
# in the properties of the Group 2 metals, magnesium to barium, and their
# compounds" - and a filename made of that is unreadable. Where the syllabus
# title is already short and concrete ("Electrolysis", "Phenol", "Amides") it
# is kept verbatim.
#
# -- On keywords --------------------------------------------------------------
# A keyword must be a phrase a teacher says out loud, and every token of it has
# to land in the same window for it to count, so multi-word keywords are kept
# short and concrete. It must also SEPARATE a subtopic from its siblings:
# "reaction", "energy", "compound" and "structure" are said in every chemistry
# lecture and discriminate nothing, so they are deliberately absent. What is
# present is named methods and named objects - Born-Haber cycle, Nernst
# equation, ligand exchange, azo dye, tetrahedral complex, Kstab.
#
# A term goes in keywords OR aliases, never both: retriever._keyword_hits
# counts it once from each and search_document emits keywords twice plus
# aliases once, so a duplicated term silently carries three times the weight.
#
# These matter less than they used to. The production classifier is ChatGPT
# reading the learning outcomes, not BM25 counting keywords, so the outcome
# text above carries most of the signal. Keywords still prime the Whisper
# decoder and still feed the reported keyword line, which is why they are
# curated rather than omitted.

subject_id: a2_chemistry
subject_name: A2 Chemistry
syllabus_code: "9701"
syllabus_years: "2025-2027"
node_id_prefix: a2chem
source: >-
  Topic, subtopic and learning-outcome text extracted verbatim from the A Level
  subject content of the official Cambridge International AS & A Level
  Chemistry 9701 syllabus for 2025, 2026 and 2027. Drive folder names, teaching
  order, short titles, keywords and aliases are hand-curated.

subject_vocabulary:
