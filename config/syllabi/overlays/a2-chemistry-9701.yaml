# -- The Introduction chapter --------------------------------------------------
# Not syllabus content, which is exactly why it is here rather than under
# `topics`. The first session of a course is the year plan, the paper codes and
# the calculator policy, and it has to go somewhere - without this node the
# classifier recognises the recording perfectly and has nowhere to file it.
#
# The title has to stay "Introduction": `naming.orientation_label` is the same
# string, and it is what finds this node.
extra_chapters:
  - id: introduction
    title: Introduction
    teaching_order: 0
    drive_folder_name: "0. Introduction"
    aliases: [orientation, course intro, first class, welcome, induction]
    keywords:
      - syllabus
      - year plan
      - exam structure
      - paper 1
      - paper 2
      - paper 3
      - paper 4
      - grade boundaries
      - course outline

