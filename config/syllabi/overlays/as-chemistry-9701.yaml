        # "Ar" is kept - it is not an English word.
        #
        # "unified atomic mass unit" replaced by the three-token form: the
        # teacher says "unified atomic mass" 6 times on 16 Aug and the
        # four-token version not once, and with adjacency matching the longer
        # key can never fire on the shorter phrase.
        #
        # The abundance and averaging vocabulary below is what this teacher
