      # *defines* Ar in chapter 4, and "M+1"/"M+2"/"3:1 ratio" tokenise to bare
      # digits plus "m". With those in place a focused relative-atomic-mass
      # lecture was filed under Spectroscopy — the wrong Drive folder.
      #
