# Curation overlay for Cambridge International AS Level Chemistry 9701 (2025-2027).
#
# Everything the official syllabus already contains — subtopic codes, verbatim
# subtopic titles, learning-outcome text — is read from the syllabus JSON by
# scripts/ingest_syllabus.py and must NOT be repeated here. This file holds only
# what the syllabus cannot tell you:
#
#   chapters              which Drive folder each syllabus subtopic is taught in
#   drive_folder_name     the exact folder string placement matches on
#   teaching_order        the leading "3." in the folder name
#   coursebook_chapter    the "(Chapter 4)" in the folder name
#   short_title           the KEYWORDS-ONLY label that lands in the filename
#   keywords / aliases    what a teacher actually says out loud, which is what
#                         retrieval scores the transcript against
#
# ── A chapter is a folder, not a syllabus topic ───────────────────────────────
# These do not correspond one-to-one, and assuming they do misfiles whole
# chapters. Cambridge topic 1 "Atomic structure" is split across two folders:
# 1.1/1.2 are taught in "1. Atomic Structure (Chapter 1)" and 1.3/1.4 in
# "2. Electrons in Atoms (Chapter 2)". Conversely one folder can hold subtopics
# from three different topics — "7. Hydrocarbons (Chapter 15)" holds 14.1, 14.2
# and 20.1, because addition polymerisation is taught the day after alkenes.
#
# So the tree this overlay produces is:
#
#     depth 0 = chapter   one Drive folder. A recording belongs to exactly one,
#                         chosen by weighting transcript content per chapter.
#     depth 1 = subtopic  one Cambridge subtopic. Filenames are named from
#                         these: one subtopic normally, two at most, never three.
#
# ── short_title is the filename ───────────────────────────────────────────────
# It is not a summary of the subtopic, it is the text a student reads in a
# folder listing next to a date. Two to four words, under about 35 characters,
# Title Case, "&" rather than "and", and distinguishable from every sibling in
# the same folder. Several Cambridge titles are unusable verbatim and are cut
# down here: "Intermolecular forces, electronegativity and bond properties"
# becomes "Intermolecular Forces"; "Redox processes: electron transfer and
# changes in oxidation number (oxidation state)" becomes "Redox & Oxidation
# Numbers". The verbatim title is still carried on the node for retrieval — only
# the filename uses the short form.
#
# ── The two keyword rules ─────────────────────────────────────────────────────
# Both are load-bearing and both fail silently when broken.
#
# 1. A keyword is a phrase a teacher SAYS OUT LOUD, never a description of the
#    topic. Retrieval counts a keyword only when EVERY one of its tokens appears
#    in the same ~4-minute window, so "explain the trend in electronegativity
#    across a period" never fires. "electronegativity", "Pauling" and "across a
#    period" do.
#
# 2. A keyword must SEPARATE a subtopic from its siblings in the same chapter.
#    A term every lecture in the folder says — "bond" in Chemical Bonding,
#    "mole" in Moles and Stoichiometry, "electron" anywhere — fires on all of
#    them and actively degrades the ranking. Where two siblings genuinely share
#    content (17.1 and 19.2 both cover the HCN/KCN addition) the shared terms
#    are assigned to one of them on purpose and a comment says which.
#
#    This includes a subtopic's OWN name when a sibling teaches the same
#    molecule: "alkene" sat on 14.2 and fired on 14.1 (which makes alkenes by
#    cracking) and on 20.1 (which polymerises them), so a pure polymerisation
#    lecture came out named "Alkenes + Addition Polymerisation". The word is
#    already in the node's title, short_title and outcome text, all of which
#    search_document indexes, so dropping it as a keyword costs nothing.
#
# 3. A term belongs to `keywords` OR to `aliases`, never to both.
#    retriever._keyword_hits iterates (*keywords, *aliases), so a term in both
#    counts twice toward the coverage gate; and search_document emits keywords
#    twice plus aliases once, so it also carries three times the BM25 weight of
#    an ordinary keyword. Nothing warns about it and the effect is uneven
#    across nodes, which is worse than either weight chosen deliberately.
#
# Formulae are written the way they are spoken, not the way they are printed:
# "acidified potassium dichromate", not K2Cr2O7. Whisper transcribes speech.

subject_id: as_chemistry
subject_name: AS Chemistry
syllabus_code: "9701"
syllabus_years: "2025-2027"
node_id_prefix: chem
source: >-
  Subtopic codes, verbatim subtopic titles and learning-outcome text extracted
  from the official Cambridge International AS Level Chemistry 9701 syllabus for
  2025, 2026 and 2027. The chapter grouping, Drive folder names, teaching order,
  coursebook chapter numbers, short filename titles, keywords and aliases are
  hand-curated here. Drive folder names were transcribed from the live folder
  listing and are reproduced exactly, typos included.

# Primed into the ASR decoder for every lecture in this subject. These are the
# terms generic speech recognition reliably mangles — "Le Chatelier" comes back
# as "luh shot alley", "halogenoalkane" as "halogen alkane" — and they are also
# the terms classification leans on hardest, so the error is expensive twice
# over.
subject_vocabulary:
  - stoichiometry
  - Avogadro
  - electronegativity
  - Pauling
  - halogenoalkane
  - nucleophilic
  - electrophilic
  - enthalpy
  - Hess
  - calorimetry
  - Le Chatelier
  - equilibrium
  - Bronsted-Lowry
  - Boltzmann
  - isotope
  - orbital
  - subshell
  - covalent
  - ionic
  - dative
  - VSEPR
  - hybridisation
  - allotrope
  - buckminsterfullerene
  - van der Waals
  - homologous
  - isomerism
  - enantiomer
  - chiral
  - Markovnikov
  - carbocation
  - disproportionation
  - amphoteric
  - dichromate
  - manganate
  - Tollens
  - Fehling
  - dinitrophenylhydrazine
  - tri-iodomethane
  - hydroxynitrile
  - nitrile
  - aldehyde
  - ketone
  - carboxylic
  - esterification
  - titration
  - molarity
  - wavenumber
  - spectrometry
  - delocalised

# On teaching_order: it is the leading number in the Drive folder name and
# nothing else. Two folders share "12." and two share "19." in the real Drive.
# That is reproduced faithfully rather than corrected, because placement matches
# on drive_folder_name and the number is only a sort hint.

chapters:

  # ── 0. Introduction ─────────────────────────────────────────────────────────
  # Admin, not teaching. Excluded so a course-intro recording cannot absorb
  # genuine content — an intro session name-checks half the syllabus in forty
  # minutes and would otherwise outscore the lecture that actually taught it.
  - id: introduction
    title: Introduction
    teaching_order: 0
    coursebook_chapter: null
    drive_folder_name: "0. Introduction"
    exclude_from_classification: true
    aliases: [orientation, course intro, first class, welcome, induction]
    keywords:
      - syllabus
      - assessment
      - exam structure
      - paper 1
      - paper 2
      - paper 3
      - grade boundaries
      - course outline
      - data booklet

  # ── 1. Atomic Structure (Chapter 1) ─────────────────────────────────────────
  # Topic 1 is split across this folder and the next. 1.1 and 1.2 only.
  - id: atomic_structure
    title: Atomic Structure
    teaching_order: 1
    coursebook_chapter: 1
    drive_folder_name: "1. Atomic Structure (Chapter 1)"
    aliases: [structure of the atom, subatomic particles, chapter 1,
              AOD, atomic orbital diagram]
    keywords:
      - nucleus
      - proton
      - neutron
      - nucleon number
      - proton number
      - isotope
      - atomic radius
    subtopics:
      - code: "1.1"
        # "Subatomic Particles & Radius" until the audit of the August 2026
        # recordings. Cambridge 1.1.7 really is the radius trends, so the old
        # title described the SUBTOPIC honestly - but short_title is not a
        # description of the subtopic, it is the filename, and it has to be
        # true of the recording it lands on. Of the two real 1.1 lectures,
        # 11 Aug says "radius" not once, and 13 Aug reaches it only at 42:58
        # of 52 minutes - about seven minutes, after the deflection
        # demonstration that is the substance of both. Naming 88% of a lecture
        # after its last 13% is the failure the "&" form invites.
        #
        # What this costs: a future lecture that really is 1.1.7 - the
        # variation of atomic and ionic radius across a period and down a
        # group - now comes out called "Subatomic Particles", which is wrong
        # in the other direction. The keywords "atomic radius", "ionic
        # radius", "across a period" and "down a group" are still on the node,
        # so such a lecture is still MATCHED correctly; only its label is
        # poor. If it turns out to be taught as its own session often enough
        # to matter, the fix is to split 1.1 into two nodes rather than to put
        # both words back into one filename.
        short_title: Subatomic Particles
        aliases: [particles in the atom, subatomic particles, structure of the atom]
        # No bare "proton"/"neutron"/"electron" here: 1.2 says all three in
        # every sentence, so they cannot separate the two lectures. The
        # discriminator is the deflection demonstration.
        #
        # The list below was written from the syllabus wording and missed the
        # words this teacher actually uses. Both real recordings of this
        # subtopic ARE the deflection demonstration, and they say it two
        # different ways: on 11 Aug "deflection" and "deflected" occur ZERO
        # times and "deviation"/"deviate"/"deviated"/"undeviated" occur 29,
        # while on 13 Aug it is the other way round - "deflect*" 43 times and
        # "deviat*" once. One lesson, two vocabularies, and the node only had
        # one of them. "charge to mass ratio" (said 30 times on 13 Aug) and
        # "angle of deflection" (21 times) were on neither list.
        #
        # "charge to mass ratio" can only live here now that 22.2 no longer
        # carries "mass to charge ratio" - see the note there.
        #
        # "hydride" and the plate terms are not stray organic/physics words:
        # the demonstration fires beams of proton, hydride and deuterium
        # between charged plates and compares how far each one bends.
        keywords:
          - nucleus
          - empty space
          - dense nucleus
          - relative charge
          - relative mass
          - nucleon
          - nucleons
          - nucleon number
          - proton number
          - mass number
          - atomic number
          - electric field
          - deflection
          - deflected
          - angle of deflection
          - deviation
          - deviate
          - deviated
          - undeviated
          - charge to mass ratio
          - elementary charge
          - negative plate
          - positive plate
          - hydride
          - oppositely charged plates
          - atomic radius
          - ionic radius
          - across a period
          - down a group

      - code: "1.2"
        short_title: Isotopes
        aliases: [isotopes of an element]
        # The nuclide names and the abundance vocabulary have moved to 2.1.
        # They are not what you say when you teach what an isotope IS - they
        # are what you say when you teach RELATIVE ATOMIC MASS, and this node
        # having them is what sent the 16 Aug lecture to the wrong subtopic
        # AND the wrong Drive folder. On that recording "abundance" occurs 16
        # times, "carbon-12" 6 and "relative atomic mass" 11: it is a chapter-4
        # lecture, and this chapter-1 node was quoting its vocabulary back at
        # it. Every spelling still exists, on 2.1, for the reason the old
        # comment gave - "carbon-12", "carbon 12" and "carbon twelve" tokenise
        # three different ways and Whisper writes whichever it hears.
        #
        # What is left here is the definition itself, which 2.1 never states.
        #
        # "deuterium" and "tritium" stay, but they are weak: the 1.1
        # deflection demonstration fires proton, hydride and DEUTERIUM beams
        # between charged plates, so they fire on 1.1's lectures too. They are
        # left because a real isotopes lecture does say them, and 1.1 now
        # outscores this node on those windows by its own vocabulary rather
        # than by taking these away.
        #
        # No ASR mis-spellings ("dutrium") here: on 11 Aug that would
        # strengthen exactly the wrong node. Decoder priming is what
        # subject_vocabulary is for.
        #
        # Bare "isotope"/"isotopes" are gone for the reason the chapter header
        # gives about "alkene" on 14.2: a subtopic's own name is not a keyword
        # when a sibling teaches the same thing. Relative atomic mass is
        # DEFINED as a weighted mean over isotopes, so 2.1's lecture says the
        # word constantly - on 16 Aug it says "isotope" 45 times, more often
        # than the isotopes lecture would. With these two keys in place that
        # lecture still gave six windows to this node and tied 40%-40% with
        # the node that was actually being taught. The word is already in this
        # node's title, short_title and outcome text, all of which
        # search_document indexes, so dropping it costs the score nothing and
        # only stops it winning windows it cannot discriminate.
        keywords:
          - same chemical properties
          - different physical properties
          - same number of protons
          - different number of neutrons
          - same element different mass
          - deuterium
          - tritium

