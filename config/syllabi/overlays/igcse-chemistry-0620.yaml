# Curation overlay for Cambridge IGCSE Chemistry 0620 (2026-2028).
#
# The syllabus half of this taxonomy - topic and subtopic numbers, titles and
# all 242 learning outcomes - is extracted verbatim from the official PDF by
# scripts/ingest_syllabus.py and marked verified: true. Nothing here repeats
# it. This file holds only what the PDF cannot say: which Drive folder a
# chapter's recordings live in, the order the chapters are taught, the keywords
# that go in a filename, and what a teacher says out loud.
#
# -- Which syllabus version ---------------------------------------------------
# 2026-2028, because the recordings are for the May/June 2027 series. 0971 is
# the same subject content under the 9-1 grade scale, so a 0971 cohort can use
# this file unchanged; only the grading differs.
#
# -- Core and Supplement ------------------------------------------------------
# 0620 states most subtopics twice: a Core block and a Supplement block, with
# the outcome numbering running straight through both. They are ONE subtopic
# and get ONE short_title, deliberately - a Core lesson and a Supplement lesson
# on the same material must not compete for two different filenames. The
# ingester collects both blocks under the subtopic they belong to.
#
# -- Chapter folders ----------------------------------------------------------
# One chapter per syllabus topic, numbered in syllabus order, matching the
# convention the AS Chemistry Drive tree already uses. teaching_order carries
# the leading ordinal so the listing sorts into teaching order rather than
# alphabetically. coursebook_chapter is null: no coursebook numbering is on
# record for this subject, and inventing one from teaching_order is exactly the
# transposition ADR-013 exists to prevent.
#
# -- short_title --------------------------------------------------------------
# Keywords only, 2-4 words, Title Case. Most 0620 subtopic titles are already
# good and are kept verbatim - "Diffusion", "Isotopes", "Electrolysis",
# "Alkanes", "Chromatography". The ones that read as a list or a description
# are cut down: "The characteristic properties of acids and bases" becomes
# "Acids & Bases", "Simple molecules and covalent bonds" becomes "Covalent
# Bonding", "The mole and the Avogadro constant" becomes "Moles & Avogadro".
#
# -- On keywords --------------------------------------------------------------
# A keyword has to be a phrase a teacher says out loud, and every token of it
# has to land in the same window to count. It also has to SEPARATE a subtopic
# from its siblings, which is hard in chemistry: "reaction", "element",
# "compound", "solution" and "structure" are said in every lecture in the
# subject and discriminate nothing, so they are absent. What is present is
# named methods and named objects - dot-and-cross diagram, Avogadro constant,
# reactivity series, sacrificial protection, blast furnace, cracking, addition
# polymerisation, flame test.
#
# A term goes in keywords OR aliases, never both: a duplicate silently carries
# three times the BM25 weight of an ordinary keyword.

subject_id: igcse_chemistry
subject_name: IGCSE Chemistry
syllabus_code: "0620"
syllabus_years: "2026-2028"
node_id_prefix: igchem
source: >-
  Topic, subtopic and learning-outcome text extracted verbatim from the
  official Cambridge IGCSE Chemistry 0620 syllabus for 2026, 2027 and 2028
  (Core and Supplement). Drive folder names, teaching order, short titles,
  keywords and aliases are hand-curated.

