        is the probability that it is not blue?'
      verified: true
    - code: 8.1.5
      text: 'Understand and use probability notation. Notes and examples: P(A) is the probability of A;
        P(A′) is the probability of not A. Probabilities should be given as a fraction, decimal or percentage.
        Problems may require using information from tables, graphs or Venn diagrams. e.g. P(B) = 0.8,
        find P(B′).'
