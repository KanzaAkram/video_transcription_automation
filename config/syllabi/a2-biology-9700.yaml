        second messenger, cyclic AMP (cAMP) - activation of protein kinase A by cAMP leading to initiation
        of an enzyme cascade - amplification of the signal through the enzyme cascade as a result of activation
        of more and more enzymes by phosphorylation - cellular response in which the final enzyme in the
        pathway is activated, catalysing the breakdown of glycogen'
      verified: true
