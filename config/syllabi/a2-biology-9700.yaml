    title: Photosynthesis as an energy transfer process
    syllabus_topic: '13.1'
    verified: true
    aliases:
    - photosynthesis
    - light dependent stage
    - light independent stage
    keywords:
    - chloroplast
    - thylakoid
    - granum
    - stroma
    - chlorophyll
    - photosystem
    - photophosphorylation
    - Calvin cycle
    - rubisco
    - RuBP
    - GP
    - TP
    - reduced NADP
    learning_outcomes:
    - code: 13.1.1
      text: describe the relationship between the structure of chloroplasts, as shown in diagrams and
        electron micrographs, and their function
      verified: true
    - code: 13.1.2
      text: explain that energy transferred as ATP and reduced NADP from the light-dependent stage is
        used during the light- independent stage (Calvin cycle) of photosynthesis to produce complex organic
        molecules
      verified: true
    - code: 13.1.3
      text: state that within a chloroplast, the thylakoids (thylakoid membranes and thylakoid spaces),
        which occur in stacks called grana, are the site of the light-dependent stage and the stroma is
        the site of the light-independent stage
      verified: true
    - code: 13.1.4
      text: describe the role of chloroplast pigments (chlorophyll a, chlorophyll b, carotene and xanthophyll)
        in light absorption in thylakoids
      verified: true
    - code: 13.1.5
      text: interpret absorption spectra of chloroplast pigments and action spectra for photosynthesis
      verified: true
    - code: 13.1.6
      text: describe and use chromatography to separate and identify chloroplast pigments (reference should
        be made to Rf values in identification of chloroplast pigments)
      verified: true
    - code: 13.1.7
      text: state that cyclic photophosphorylation and non-cyclic photophosphorylation occur during the
        light-dependent stage of photosynthesis
      verified: true
    - code: 13.1.8
      text: 'explain that in cyclic photophosphorylation: - only photosystem I (PSI) is involved - photoactivation
        of chlorophyll occurs - ATP is synthesised'
      verified: true
    - code: 13.1.9
      text: 'explain that in non-cyclic photophosphorylation: - photosystem I (PSI) and photosystem II
        (PSII) are both involved - photoactivation of chlorophyll occurs - the oxygen-evolving complex
        catalyses the photolysis of water - ATP and reduced NADP are synthesised'
      verified: true
    - code: 13.1.10
      text: 'explain that during photophosphorylation: - energetic electrons release energy as they pass
        through the electron transport chain (details of carriers are not expected) - the released energy
        is used to transfer protons across the thylakoid membrane - protons return to the stroma from
        the thylakoid space by facilitated diffusion through ATP synthase, providing energy for ATP synthesis
        (details of ATP synthase are not expected)'
      verified: true
    - code: 13.1.11
      text: 'outline the three main stages of the Calvin cycle: - rubisco catalyses the fixation of carbon
        dioxide by combination with a molecule of ribulose bisphosphate (RuBP), a 5C compound, to yield
        two molecules of glycerate 3-phosphate (GP), a 3C compound - GP is reduced to triose phosphate
        (TP) in reactions involving reduced NADP and ATP - RuBP is regenerated from TP in reactions that
        use ATP'
      verified: true
    - code: 13.1.12
      text: state that Calvin cycle intermediates are used to produce other molecules, limited to GP to
        produce some amino acids and TP to produce carbohydrates, lipids and amino acids
      verified: true
