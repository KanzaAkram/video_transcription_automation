    learning_outcomes:
    - code: 12.2.1
      text: 'State where each of the four stages in aerobic respiration occurs in eukaryotic cells: -
        glycolysis in the cytoplasm - link reaction in the mitochondrial matrix - Krebs cycle in the mitochondrial
        matrix - oxidative phosphorylation on the inner membrane of mitochondria'
      verified: true
    - code: 12.2.2
      text: outline glycolysis as phosphorylation of glucose and the subsequent splitting of fructose
        1,6-bisphosphate (6C) into two triose phosphate molecules (3C), which are then further oxidised
        to pyruvate (3C), with the production of ATP and reduced NAD
      verified: true
    - code: 12.2.3
      text: explain that, when oxygen is available, pyruvate enters mitochondria to take part in the link
        reaction
      verified: true
    - code: 12.2.4
      text: describe the link reaction, including the role of coenzyme A in the transfer of acetyl (2C)
        groups
      verified: true
    - code: 12.2.5
      text: outline the Krebs cycle, explaining that oxaloacetate (4C) acts as an acceptor of the 2C fragment
        from acetyl coenzyme A to form citrate (6C), which is converted back to oxaloacetate in a series
        of small steps
      verified: true
    - code: 12.2.6
      text: explain that reactions in the Krebs cycle involve decarboxylation and dehydrogenation and
        the reduction of the coenzymes NAD and FAD
      verified: true
    - code: 12.2.7
      text: describe the role of NAD and FAD in transferring hydrogen to carriers in the inner mitochondrial
        membrane
      verified: true
    - code: 12.2.8
      text: 'explain that during oxidative phosphorylation: - hydrogen atoms split into protons and energetic
        electrons - energetic electrons release energy as they pass through the electron transport chain
        (details of carriers are not expected) - the released energy is used to transfer protons across
        the inner mitochondrial membrane - protons return to the mitochondrial matrix by facilitated diffusion
        through ATP synthase, providing energy for ATP synthesis (details of ATP synthase are not expected)
        - oxygen acts as the final electron acceptor to form water'
      verified: true
    - code: 12.2.9
      text: describe the relationship between the structure and function of mitochondria using diagrams
        and electron micrographs
      verified: true
    - code: 12.2.10
      text: outline respiration in anaerobic conditions in mammals (lactate fermentation) and in yeast
        cells (ethanol fermentation)
      verified: true
    - code: 12.2.11
      text: explain why the energy yield from respiration in aerobic conditions is much greater than the
        energy yield from respiration in anaerobic conditions (a detailed account of the total yield of
        ATP from the aerobic respiration of glucose is not expected)
      verified: true
    - code: 12.2.12
      text: explain how rice is adapted to grow with its roots submerged in water, limited to the development
        of aerenchyma in roots, ethanol fermentation in roots and faster growth of stems
      verified: true
    - code: 12.2.13
      text: describe and carry out investigations using redox indicators, including DCPIP and methylene
        blue, to determine the effects of temperature and substrate concentration on the rate of respiration
        of yeast
      verified: true
    - code: 12.2.14
      text: describe and carry out investigations using simple respirometers to determine the effect of
        temperature on the rate of respiration
      verified: true
