      text: explain why a promoter may have to be transferred into an organism as well as the desired
        gene
      verified: true
    - code: 19.1.6
      text: explain how gene expression may be confirmed by the use of marker genes coding for fluorescent
        products
      verified: true
    - code: 19.1.7
      text: explain that gene editing is a form of genetic engineering involving the insertion, deletion
        or replacement of DNA at specific sites in the genome
      verified: true
