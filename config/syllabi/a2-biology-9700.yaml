        specific characteristics of an organism and that this may involve transferring a gene into an
        organism so that the gene is expressed
      verified: true
    - code: 19.1.3
      text: 'explain that genes to be transferred into an organism may be: - extracted from the DNA of
        a donor organism - synthesised from the mRNA of a donor organism - synthesised chemically from
        nucleotides'
      verified: true
    - code: 19.1.4
      text: explain the roles of restriction endonucleases, DNA ligase, plasmids, DNA polymerase and reverse
        transcriptase in the transfer of a gene into an organism
      verified: true
