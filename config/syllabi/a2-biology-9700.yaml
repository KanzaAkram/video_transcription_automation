      text: outline how microarrays are used in the analysis of genomes and in detecting mRNA in studies
        of gene expression
      verified: true
    - code: 19.1.11
      text: outline the benefits of using databases that provide information about nucleotide sequences
        of genes and genomes, and amino acid sequences of proteins and protein structures
