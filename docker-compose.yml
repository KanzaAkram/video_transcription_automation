# Local development stack.
#
# The same images deploy to any container host. In production the recommended
# split (docs/ARCHITECTURE.md § 17, option B) puts `api` and `scheduler` on a
# small always-on VPS with a public HTTPS endpoint, and `worker-gpu` wherever
# the GPU is — the GPU host needs no inbound ports, it polls the queue.

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: {context: ., dockerfile: docker/Dockerfile.api}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@postgres:5432/pipeline
      REDIS_URL: redis://redis:6379/0
    ports: ["8080:8080"]
    volumes:
      # Read-only: the API has no reason to modify configuration or keys.
      - ./config:/app/config:ro
      - ./credentials:/app/credentials:ro
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  # Network-bound work: download, Drive calls, classification, upload.
  worker-io:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: >
      celery -A pipeline.orchestration.tasks worker
      --loglevel=INFO --queues=io --concurrency=8
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@postgres:5432/pipeline
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
      - ./credentials:/app/credentials:ro
      - media_cache:/app/media_cache
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  # Transcription only. Concurrency must equal the GPU count — a second
  # concurrent job on one GPU means both run out of memory rather than
  # finishing faster.
  worker-gpu:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: >
      celery -A pipeline.orchestration.tasks worker
      --loglevel=INFO --queues=gpu --concurrency=1
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@postgres:5432/pipeline
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
      - ./credentials:/app/credentials:ro
      - media_cache:/app/media_cache
      - hf_cache:/home/appuser/.cache/huggingface   # don't redownload weights
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    # Uncomment on a CUDA host (and switch the base image in
    # docker/Dockerfile.worker to an NVIDIA CUDA runtime image):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # Exactly one instance. Renews Drive watch channels before they expire,
  # runs the reconciliation sweep, and retries the dead-letter queue.
  scheduler:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: celery -A pipeline.orchestration.tasks beat --loglevel=INFO
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@postgres:5432/pipeline
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
      - ./credentials:/app/credentials:ro
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  media_cache:
  hf_cache:
